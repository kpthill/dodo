<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dodo Language Specification</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a1a;
      color: #d0d0d0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 16px;
      line-height: 1.75;
      padding: 40px 20px 80px;
    }

    #nav {
      max-width: 800px;
      margin: 0 auto 32px;
    }
    #nav a {
      color: #7ec8e3;
      text-decoration: none;
      font-family: 'Courier New', monospace;
      font-size: 13px;
    }
    #nav a:hover { text-decoration: underline; }

    main {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      color: #7ec8e3;
      border-bottom: 1px solid #333;
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    h2 {
      font-size: 1.4rem;
      color: #7ec8e3;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 6px;
      margin: 40px 0 16px;
    }

    h3 {
      font-size: 1.1rem;
      color: #a8d8f0;
      margin: 28px 0 12px;
    }

    h4 {
      font-size: 1rem;
      color: #c0e8ff;
      margin: 20px 0 10px;
      font-style: italic;
    }

    p { margin-bottom: 14px; }

    ul, ol {
      margin: 0 0 14px 28px;
    }
    li { margin-bottom: 4px; }

    code {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.88em;
      background: #252525;
      color: #a8d8a8;
      padding: 1px 5px;
      border-radius: 3px;
    }

    pre {
      background: #111;
      border-left: 3px solid #7ec8e3;
      padding: 14px 16px;
      margin: 16px 0;
      overflow-x: auto;
      border-radius: 0 4px 4px 0;
    }
    pre code {
      background: none;
      color: #c8e6c8;
      padding: 0;
      font-size: 0.87em;
      line-height: 1.55;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 16px 0;
      font-size: 0.9em;
      font-family: 'Courier New', Courier, monospace;
    }
    th {
      background: #222;
      color: #7ec8e3;
      text-align: left;
      padding: 7px 12px;
      border: 1px solid #333;
    }
    td {
      padding: 6px 12px;
      border: 1px solid #2a2a2a;
      vertical-align: top;
    }
    tr:nth-child(even) td { background: #1e1e1e; }

    hr {
      border: none;
      border-top: 1px solid #2a2a2a;
      margin: 36px 0;
    }

    strong { color: #e0e0e0; }

    a { color: #7ec8e3; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="nav"><a href="repl.html">← back to REPL</a></div>
  <main id="content"></main>

  
  <script>
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function inlineRender(raw) {
    // Extract code spans first to protect them from other processing
    const spans = [];
    let s = raw.replace(/`([^`]+)`/g, (_, code) => {
      spans.push(`<code>${escapeHtml(code)}</code>`);
      return `\x00${spans.length - 1}\x00`;
    });
    s = escapeHtml(s);
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    s = s.replace(/\x00(\d+)\x00/g, (_, i) => spans[+i]);
    return s;
  }

  function renderTable(lines) {
    let html = '<table>\n';
    let isHeader = true;
    for (const line of lines) {
      if (/^\|[\s\-|:]+\|$/.test(line.trim())) continue; // separator row
      const cells = line.split('|').slice(1, -1).map(c => c.trim());
      if (isHeader) {
        html += '<thead><tr>' + cells.map(c => `<th>${inlineRender(c)}</th>`).join('') + '</tr></thead>\n<tbody>\n';
        isHeader = false;
      } else {
        html += '<tr>' + cells.map(c => `<td>${inlineRender(c)}</td>`).join('') + '</tr>\n';
      }
    }
    html += '</tbody></table>\n';
    return html;
  }

  function renderMarkdown(md) {
    const lines = md.split('\n');
    let html = '';
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];

      // Fenced code block
      if (line.match(/^```/)) {
        i++;
        let code = '';
        while (i < lines.length && !lines[i].match(/^```/)) {
          code += lines[i] + '\n';
          i++;
        }
        i++;
        html += `<pre><code>${escapeHtml(code.replace(/\n$/, ''))}</code></pre>\n`;
        continue;
      }

      // Horizontal rule
      if (/^---+\s*$/.test(line)) {
        html += '<hr>\n';
        i++;
        continue;
      }

      // Heading
      const hm = line.match(/^(#{1,4})\s+(.*)/);
      if (hm) {
        const lvl = hm[1].length;
        const id = hm[2].toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        html += `<h${lvl} id="${id}">${inlineRender(hm[2])}</h${lvl}>\n`;
        i++;
        continue;
      }

      // Table (line starts with |)
      if (line.startsWith('|')) {
        const tableLines = [];
        while (i < lines.length && lines[i].startsWith('|')) {
          tableLines.push(lines[i]);
          i++;
        }
        html += renderTable(tableLines);
        continue;
      }

      // Unordered list
      if (line.match(/^- /)) {
        html += '<ul>\n';
        while (i < lines.length && lines[i].match(/^- /)) {
          let text = lines[i].slice(2);
          i++;
          while (i < lines.length && lines[i].match(/^  \S/)) {
            text += ' ' + lines[i].trim();
            i++;
          }
          html += `<li>${inlineRender(text)}</li>\n`;
        }
        html += '</ul>\n';
        continue;
      }

      // Blank line
      if (line.trim() === '') {
        i++;
        continue;
      }

      // Paragraph — collect until blank line or block-level element
      let para = '';
      const paraStart = i;
      while (i < lines.length) {
        const l = lines[i];
        if (l.trim() === '') break;
        if (l.match(/^#{1,4}\s/) || l.startsWith('|') || l.match(/^```/) || l.match(/^- /) || /^---+\s*$/.test(l)) break;
        para += (para ? ' ' : '') + l.trim();
        i++;
      }
      if (para) html += `<p>${inlineRender(para)}</p>\n`;
      if (i === paraStart) i++; // safety: never stall on an unrecognized line
    }

    return html;
  }

  // The spec is fetched live from dodo-spec.md — no embedded copy to go stale.
  // Requires serving over HTTP (file:// will not work).
  fetch('./dodo-spec.md')
    .then(resp => {
      if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + resp.statusText);
      return resp.text();
    })
    .then(src => {
      document.getElementById('content').innerHTML = renderMarkdown(src);
    })
    .catch(err => {
      document.getElementById('content').innerHTML =
        '<p style="color:#e06c75">Failed to load the spec (' +
        escapeHtml(String((err && err.message) || err)) +
        '). If viewing locally, serve this directory over HTTP ' +
        '(e.g. <code>python3 -m http.server</code>) — file:// is not supported.</p>';
    });
  </script>
</body>
</html>
