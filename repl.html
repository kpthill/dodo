<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dodo REPL</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 8px;
    }
    h1 { color: #7ec8e3; font-size: 15px; font-weight: normal; display: inline; }
    #toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #toolbar a {
      color: #7ec8e3;
      text-decoration: none;
      font-size: 12px;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      padding: 4px 10px;
      background: #2a2a2a;
    }
    #toolbar a:hover { background: #333; }
    #example-select {
      background: #2a2a2a;
      color: #aaa;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      padding: 4px 10px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }
    #example-select:hover { background: #333; }
    #output {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
    }
    .entry { margin-bottom: 6px; }
    .in  { color: #7ec8e3; white-space: pre-wrap; }
    .in::before { content: 'dodo> '; }
    .out { color: #e0e0e0; padding-left: 16px; }
    .printed { color: #aaa; padding-left: 16px; }
    .printed::before { content: '> '; }
    .err { color: #e07070; padding-left: 16px; }
    #input-row { display: flex; align-items: flex-end; gap: 8px; }
    #prompt { color: #7ec8e3; white-space: nowrap; padding-bottom: 7px; }
    #input {
      flex: 1;
      background: #111;
      color: #e0e0e0;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 6px 8px;
      font-family: inherit;
      font-size: inherit;
      outline: none;
      resize: none;
      overflow-y: hidden;
      min-height: 32px;
      line-height: 1.5;
    }
    #input:focus { border-color: #7ec8e3; }
    button {
      background: #2a2a2a;
      color: #aaa;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      padding: 6px 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
    }
    button:hover { background: #333; }
  </style>
</head>
<body>
  <div id="toolbar">
    <h1>Dodo REPL</h1>
    <a href="spec.html" target="_blank">spec ↗</a>
    <select id="example-select">
      <option value="">examples…</option>
      <option value="list">list.dodo</option>
      <option value="map">map.dodo</option>
      <option value="match">match.dodo</option>
      <option value="ffi">ffi.dodo</option>
    </select>
  </div>
  <div id="output"></div>
  <div id="input-row">
    <span id="prompt">dodo&gt;</span>
    <textarea id="input" rows="1" autofocus autocomplete="off" spellcheck="false" placeholder="type an expression… (Ctrl+Enter to run)"></textarea>
    <button id="clear-btn">clear</button>
  </div>

<script type="importmap">
{
  "imports": {
    "node:module": "./repl-shims.js",
    "path": "./repl-shims.js"
  }
}
</script>
<script>
  // Fallback notice for browsers without import-map support (pre-2023).
  if (!(window.HTMLScriptElement && HTMLScriptElement.supports &&
        HTMLScriptElement.supports("importmap"))) {
    document.addEventListener("DOMContentLoaded", function () {
      var div = document.createElement("div");
      div.textContent = "This REPL needs a browser with import-map support " +
        "(Chrome/Edge 89+, Firefox 108+, Safari 16.4+).";
      div.style.cssText = "color:#e06c75;padding:8px;font-family:monospace;";
      document.body.prepend(div);
    });
  }
</script>

<script type="module">

// The interpreter is loaded live from impl/ (Patrick's code) — no copies.
// Node-only imports inside eval.js are redirected to repl-shims.js by the
// import map above. Requires serving over HTTP (file:// will not work).
import { trimWS } from "./impl/parsing.js";
import { g } from "./impl/grammar.js";
import { coreEnv } from "./impl/core.js";
import { evalDodo } from "./impl/eval.js";

// ============================================================
// REPL
// ============================================================

function displayValue(v) {
  if (v === null) return 'nil';
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'number') return String(v);
  if (typeof v === 'string') return JSON.stringify(v);
  if (typeof v === 'function') return '#<fn>';
  if (Array.isArray(v)) return '[' + v.map(displayValue).join(' ') + ']';
  if (typeof v === 'object') {
    const pairs = Object.entries(v).map(([k, val]) => `${k}: ${displayValue(val)}`);
    return '{' + pairs.join(', ') + '}';
  }
  return String(v);
}

// Browser print/println: shadow the core builtins through the env stack
// (getEnvValue searches innermost-last first), so impl/core.js stays untouched.
// print appends without a newline, println with one; both return nil (spec).
let capturedOutput = '';
const replIO = {
  print:   s => { capturedOutput += String(s); return null; },
  println: s => { capturedOutput += String(s) + '\n'; return null; },
};

// Persistent top-level env so def/defn accumulate across entries.
// def/defn write to env.at(-1), so user definitions land in the trailing {}.
const replEnv = [coreEnv, replIO, {}];

function flushCapturedOutput(entry) {
  if (!capturedOutput) return;
  for (const line of capturedOutput.replace(/\n$/, '').split('\n')) {
    entry.appendChild(addLine('printed', line));
  }
  capturedOutput = '';
}

const output = document.getElementById('output');
const input  = document.getElementById('input');

function addLine(cls, text) {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = text;
  return div;
}

function evaluate(source, label) {
  if (!label && source.trim() === '/clear') { output.innerHTML = ''; return; }

  const entry = document.createElement('div');
  entry.className = 'entry';
  entry.appendChild(addLine('in', label ?? source));

  try {
    const parsed = g.program(source);
    if (!parsed || trimWS(parsed.rest) !== '') {
      throw new Error('Parse error' + (parsed ? ` near: ${parsed.rest.slice(0,20)}` : ''));
    }

    capturedOutput = '';
    let result;
    try {
      result = evalDodo(parsed.result, replEnv);
    } finally {
      flushCapturedOutput(entry); // show output printed before an error, too
    }
    if (result !== null && result !== undefined) {
      entry.appendChild(addLine('out', displayValue(result)));
    }
  } catch (e) {
    entry.appendChild(addLine('err', e.message));
  }

  output.appendChild(entry);
  output.scrollTop = output.scrollHeight;
}

const examples = {
  list: `; list.dodo — exercising list operations

; Basic access
(println (head [1 2 3]))
(println (tail [1 2 3]))
(println (nth [10 20 30] 1))
(println (len [1 2 3]))
(println (empty? []))
(println (empty? [1]))

; Construction
(println (cons 0 [1 2 3]))
(println (concat [1 2] [3 4]))
(println (reverse [1 2 3]))
(println (range 0 5))

; Higher-order
(println (map (fn (x) (* x x)) [1 2 3 4 5]))
(println (filter (fn (x) (> x 3)) [1 2 3 4 5]))
(println (fold (fn (acc x) (+ acc x)) 0 [1 2 3 4 5]))

; Sorting
(println (sort [3 1 4 1 5 9 2 6]))
(println (sort-by (fn (x) (nth x 1)) [["b" 2] ["a" 1] ["c" 3]]))

; Zip and enumerate
(println (zip [1 2 3] ["a" "b" "c"]))
(println (enumerate ["x" "y" "z"]))

; Recursive sum using fold
(def total (fold (fn (acc x) (+ acc x)) 0 (range 1 11)))
(println total)`,

  map: `; map.dodo — exercising map operations

(def m {"a": 1, "b": 2, "c": 3})

; Basic access
(println (get m "a"))
(println (get m "z"))
(println (get-or m "z" 99))
(println (has? m "b"))
(println (has? m "z"))

; Keys, vals, entries
(println (keys m))
(println (vals m))
(println (entries m))

; Functional updates
(def m2 (put m "d" 4))
(println (get m2 "d"))
(println (get m  "d"))

(def m3 (remove m "b"))
(println (has? m3 "b"))
(println (has? m  "b"))

; Merge
(def merged (merge {"x": 1, "y": 2} {"y": 99, "z": 3}))
(println (get merged "x"))
(println (get merged "y"))
(println (get merged "z"))

; Building a map from a list using fold
(def index
  (fold (fn (acc entry)
          (put acc (nth entry 0) (nth entry 1)))
        {}
        [["one" 1] ["two" 2] ["three" 3]]))
(println (get index "two"))`,

  match: `; match.dodo — pattern matching exercises

(println "── 1. literal number ──")
(defn describe-num (n)
  (match n (0 "zero") (1 "one") (2 "two") (_ "other")))
(println (describe-num 0))
(println (describe-num 1))
(println (describe-num 99))

(println "── 2. literal bool and nil ──")
(defn describe-val (v)
  (match v (true "yes") (false "no") (nil "nothing")))
(println (describe-val true))
(println (describe-val false))
(println (describe-val nil))

(println "── 3. literal string ──")
(defn greet-lang (lang)
  (match lang ("en" "Hello") ("es" "Hola") ("fr" "Bonjour") (_ "???")))
(println (greet-lang "en"))
(println (greet-lang "fr"))
(println (greet-lang "de"))

(println "── 4. wildcard ──")
(defn always-ok (x) (match x (_ "ok")))
(println (always-ok 42))
(println (always-ok "hello"))
(println (always-ok nil))

(println "── 5. variable binding ──")
(defn echo (x) (match x (v (str "got: " (number->string v)))))
(println (echo 7))
(println (echo -3))

(println "── 6. guards ──")
(defn sign (n)
  (match n
    (x when (> x 0) "positive")
    (x when (< x 0) "negative")
    (_ "zero")))
(println (sign 5))
(println (sign -3))
(println (sign 0))

(println "── 7. empty list ──")
(defn empty-check (lst)
  (match lst ([] "empty") (_ "non-empty")))
(println (empty-check []))
(println (empty-check [1 2]))

(println "── 8. fixed-length list binding ──")
(defn describe-pair (p)
  (match p ([a b] (str (number->string a) " and " (number->string b)))))
(println (describe-pair [3 4]))
(println (describe-pair [10 20]))

(println "── 9. list with literal patterns ──")
(defn target-check (lst)
  (match lst ([1 2 3] "target") (_ "non-target")))
(println (target-check [1 2 3]))
(println (target-check [1 4 3]))
(println (target-check [1 2]))
(println (target-check [1 2 3 4]))`,

  ffi: `; ffi.dodo — JavaScript FFI

(println (js "Math.sqrt" 144))
(println (js "Math.pow" 2 10))
(println (js "Math.abs" -42))
(println (js "Math.max" 3 7 2 9 1))

(println (js "JSON.stringify" {"x": 1, "y": 2}))

(def parsed (js "JSON.parse" "{\\"name\\":\\"dodo\\",\\"version\\":1}"))
(println (js/get parsed "name"))
(println (js/get parsed "version"))

(def pi (js/get "Math" "PI"))
(println pi)

(println (js/get "Number" "MAX_SAFE_INTEGER"))

(def randoms
  (map (fn (_) (js "Math.floor" (* (js "Math.random") 100)))
       (range 0 5)))
(println randoms)`,
};

function autoResize() {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
}

function submitInput() {
  const src = input.value.trim();
  if (!src) return;
  input.value = '';
  autoResize();
  evaluate(src);
}

function loadExample(name) {
  input.value = examples[name];
  autoResize();
  input.focus();
  // scroll to bottom so the prompt is visible
  input.setSelectionRange(0, 0);
}

input.addEventListener('input', autoResize);

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    submitInput();
  }
});

document.getElementById('clear-btn').addEventListener('click', () => {
  output.innerHTML = '';
});

document.getElementById('example-select').addEventListener('change', function() {
  if (this.value) { loadExample(this.value); this.value = ''; }
});

// Welcome message
{
  const div = document.createElement('div');
  div.style.color = '#555';
  div.style.marginBottom = '8px';
  div.textContent = 'Dodo REPL — Ctrl+Enter to run. /clear to reset.';
  output.appendChild(div);
}

</script>
</body>
</html>
